<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New York — Photos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Serif+Text:ital@0;1&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <link rel="icon" href="/assets/images/fav.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css">
    <style>
        /* Edges and gutters match #image_grid in styles.css, so the masonry
           columns land on the site's 6-column grid (each spans two). */
        .gallery-shell {
            padding: var(--spacing-md) calc(var(--spacing-md) + 9.9px) var(--spacing-md) var(--spacing-md);
            display: grid;
            gap: clamp(10px, 1.2vw, 20px);
        }

        .gallery-header {
            margin-top: clamp(24px, 3vw, 52px);
            max-width: 46ch;
            display: grid;
            gap: clamp(8px, 1.5vw, 18px);
            text-transform: uppercase;
            letter-spacing: 0.2vw;
            padding-bottom: clamp(8px, 0.8vw, 14px);
            border-bottom: var(--gallery-border);
        }

        .gallery-header h1 {
            font-family: var(--font-display);
            font-size: calc(clamp(14px, 0.45rem + 0.7vw, 21px) * 1.6);
            font-weight: var(--font-weight-normal);
            line-height: 1.1;
            text-transform: none;
            letter-spacing: normal;
            margin: 0;
        }

        .gallery-header p:empty {
            display: none;
        }

        .gallery-header p {
            margin: 0;
            line-height: 1.6;
            text-transform: none;
            letter-spacing: normal;
        }

        /* Raised to beat the #galleryGrid card-grid rule in styles.css, which
           otherwise adds its own margin and a 3-column grid over the masonry. */
        #galleryGrid.gallery-grid {
            display: flex;
            align-items: flex-start;
            gap: var(--grid-gap);
            margin: 0;
        }

        .masonry-col {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: var(--grid-gap);
        }

        .photo-card {
            display: block;
            break-inside: avoid;
            margin: 0;
            cursor: zoom-in;
        }

        .photo-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            background: #f8f8f8;
            border: var(--gallery-border);
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            align-items: center;
            justify-content: center;
            padding: clamp(24px, 6vw, 80px);
            z-index: 1000;
            cursor: zoom-out;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: min(88vw, 1400px);
            max-height: 86vh;
            width: auto;
            height: auto;
            background: #fff;
        }
    </style>
</head>
<body>
    <div id="bar">
        <a href="/photos.html">photos</a>
        <a href="/projects.html">projects</a>
        <a href="/resume.html">resume</a>
    </div>
    <div id="letterhead">
        <a class="letterhead-name" href="/index.html"> Christopher Lam </a>
        <br>
        <a href="https://www.google.com/maps/place/San+Francisco,+CA/">San Francisco California</a>
        <br>
        <a href="https://www.instagram.com/topher_lam/">@topher_lam</a>
        <a href="https://youtu.be/tH63sBOTIeQ" id="time"></a>
        <br>
        <a href="mailto:cjlbears@gmail.com">cjlbears@gmail.com</a>
    </div>

    <main class="gallery-shell">
        <header class="gallery-header">
            <h1 id="galleryTitle"></h1>
            <p id="galleryDescription"></p>
        </header>
        <section id="galleryGrid" class="gallery-grid"></section>
    </main>

    <div class="lightbox" id="lightbox">
        <img src="" alt="">
    </div>
</body>
<script>
    const gallery = {
        title: "New York",
        description: "",
        basePath: "/photos/newYork/",
        images: [
            "newYork1.jpeg",
            "newYork2.jpeg",
            "newYork3.jpeg",
            "newYork4.jpeg",
            "newYork5.jpeg",
            "newYork6.jpeg",
            "newYork7.jpeg",
            "newYork8.jpeg",
            "newYork9.jpeg",
            "newYork10.jpeg",
            "newYork11.jpeg",
            "newYork12.jpeg",
            "newYork13.jpeg",
            "newYork14.jpeg",
            "newYork15.jpeg",
            "newYork16.jpeg"
        ]
    };

    const titleNode = document.getElementById("galleryTitle");
    const descriptionNode = document.getElementById("galleryDescription");
    const grid = document.getElementById("galleryGrid");
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = lightbox.querySelector("img");

    document.title = `${gallery.title} — Photos`;
    titleNode.textContent = gallery.title;
    descriptionNode.textContent = gallery.description;

    const createPhotoCard = (file) => {
        const figure = document.createElement("figure");
        figure.className = "photo-card";

        const img = document.createElement("img");
        img.loading = "eager";
        img.src = gallery.basePath + file;
        img.alt = `${gallery.title} photo`;

        figure.addEventListener("click", () => {
            lightbox.classList.add("active");
            lightboxImg.src = img.src;
            lightboxImg.alt = img.alt;
        });

        figure.appendChild(img);
        return figure;
    };

    let cachedRatios = null;

    const getRatios = () => {
        if (cachedRatios) return Promise.resolve(cachedRatios);
        return Promise.all(
            gallery.images.map(file => new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(img.naturalHeight / img.naturalWidth);
                img.onerror = () => resolve(1.25);
                img.src = gallery.basePath + file;
            }))
        ).then(ratios => { cachedRatios = ratios; return ratios; });
    };

    const colCount = () => window.innerWidth >= 1080 ? 3 : window.innerWidth >= 640 ? 2 : 1;
    let currentCols = 0;

    const buildGrid = (ratios) => {
        const n = colCount();
        if (n === currentCols) return;
        currentCols = n;
        grid.innerHTML = '';
        const cols = Array.from({ length: n }, () => {
            const col = document.createElement('div');
            col.className = 'masonry-col';
            grid.appendChild(col);
            return { el: col, h: 0 };
        });
        gallery.images.forEach((file, i) => {
            const shortest = cols.reduce((a, b) => a.h <= b.h ? a : b);
            shortest.el.appendChild(createPhotoCard(file));
            shortest.h += ratios[i];
        });
    };

    getRatios().then(buildGrid);

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => getRatios().then(buildGrid), 150);
    });

    lightbox.addEventListener("click", () => {
        lightbox.classList.remove("active");
        lightboxImg.src = "";
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && lightbox.classList.contains("active")) {
            lightbox.click();
        }
    });

    const timeNode = document.getElementById("time");
    let updateTimer = true;
    const updateTime = () => {
        const date = new Date();
        const time = date.toLocaleTimeString("en-US", { timeZone: "America/Los_Angeles" });
        timeNode.textContent = time.split(" ")[0] + "." + date.getMilliseconds().toString().slice(0, 2);
    };
    updateTime();
    setInterval(() => {
        if (updateTimer) updateTime();
    }, 1);

    const pauseTimer = () => {
        updateTimer = false;
        setTimeout(() => (updateTimer = true), 1500);
    };

    setTimeout(() => {
        pauseTimer();
        setInterval(pauseTimer, 60000);
    }, 60000);
</script>
</html>
